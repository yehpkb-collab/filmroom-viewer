<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Film Room: link stats</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#6b6b6b; --line:#e2e2e2; --card:#f5f5f3; --accent:#185fa5; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151515; --fg:#f1f1f1; --muted:#a0a0a0; --line:#333; --card:#202020; --accent:#85b7eb; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 16px; }
  form { display:flex; gap:8px; margin: 0 0 16px; flex-wrap: wrap; }
  input { flex: 1 1 260px; font: inherit; padding: 8px 10px; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
  button { font: inherit; padding: 8px 14px; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  td.n { font-variant-numeric: tabular-nums; }
  .err { color: #a32d2d; }
  .zero { color: var(--muted); }
  @media (max-width: 640px) { .hide-sm { display: none; } }
</style>
</head>
<body>
<main>
  <h1>Link stats</h1>
  <p>Which short links were opened, and how often. Only you can see this: it needs the <code>STATS_TOKEN</code> you set in Netlify. The token is not saved except for this tab.</p>
  <form id="f"><input id="t" type="password" autocomplete="off" placeholder="STATS_TOKEN" aria-label="Stats token"><button type="submit">Show</button></form>
  <div id="msg" class="err" role="status"></div>
  <table id="tbl" hidden>
    <thead><tr><th>Created</th><th>Video</th><th class="n">Notes</th><th class="n">Opens</th><th class="hide-sm">Last opened</th><th class="hide-sm">Link</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</main>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  function when(ms) { if (!ms) return 'never'; var d = new Date(ms); return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }); }
  function td(text, cls) { var c = document.createElement('td'); if (cls) c.className = cls; c.textContent = text; return c; }
  function load(token) {
    $('msg').textContent = '';
    return fetch('/api/stats', { headers: { Authorization: 'Bearer ' + token }, cache: 'no-store' }).then(function (r) {
      if (r.status === 404) throw new Error('Stats are switched off: set STATS_TOKEN in Netlify (Site configuration, Environment variables) and redeploy.');
      if (r.status === 401) throw new Error('That token is not right.');
      if (r.status === 429) throw new Error('Too many tries. Wait a bit.');
      if (!r.ok) throw new Error('Could not load stats (' + r.status + ').');
      return r.json();
    }).then(function (data) {
      try { sessionStorage.setItem('fr_stats_token', token); } catch (e) { /* ignore */ }
      var rows = $('rows'); rows.textContent = '';
      (data.links || []).forEach(function (l) {
        var tr = document.createElement('tr');
        tr.appendChild(td(when(l.created)));
        tr.appendChild(td((l.title || l.video || '(untitled)')));
        tr.appendChild(td(String(l.notes), 'n'));
        tr.appendChild(td(String(l.opens), 'n' + (l.opens ? '' : ' zero')));
        tr.appendChild(td(when(l.lastOpened), 'hide-sm'));
        tr.appendChild(td('#s' + l.id, 'hide-sm'));
        rows.appendChild(tr);
      });
      $('tbl').hidden = false;
      if (!(data.links || []).length) $('msg').textContent = 'No links counted yet. Links made before this version show up once someone opens them.';
    }).catch(function (e) { $('tbl').hidden = true; $('msg').textContent = e.message; });
  }
  $('f').addEventListener('submit', function (e) { e.preventDefault(); if ($('t').value) load($('t').value); });
  try { var saved = sessionStorage.getItem('fr_stats_token'); if (saved) { $('t').value = saved; load(saved); } } catch (e) { /* ignore */ }
})();
</script>
</body>
</html>
